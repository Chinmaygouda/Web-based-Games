<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock-Paper_Scissor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Rock-Paper-Scissor</h1>
    <div class="choices">
        <div class="choice" id="rock">
            <img src="images/rockt_287585.png">
        </div>
        <div class="choice" id="paper">
            <img src="images/paper_287585.png">
        </div>
        <div class="choice" id="scissor">
            <img src="images/scissors-clip-art_287585.png">
        </div>
    </div>
    <div class="scoreboard">
    <div class="score">
        <p id="userscore">0</p> 
        <p>You</p>   
    </div>
    
    <div class="score">
        <p id="compscore">0</p>  
        <p>Computer</p>   
    </div>
</div>

<div class="msgcont">
    <p id="umsg">Play ur move</p>
</div>

<script src="rapp.js"></script>

</body>
</html>
